name: Upload changed GLB files to Unity Asset Manager

on:
  push:
    branches:
      - main
    paths:
      - '**/*.glb'

jobs:
  upload-to-uam:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed .glb files
        id: glb
        shell: bash
        run: |
          changed_files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -E '\.glb$' || true)

          if [ -z "$changed_files" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"

          {
            echo "files<<EOF"
            echo "$changed_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create asset, create file, and upload each .glb
        if: steps.glb.outputs.found == 'true'
        shell: bash
        env:
          UNITY_KEY_ID: ${{ secrets.UNITY_KEY_ID }}
          UNITY_SECRET_KEY: ${{ secrets.UNITY_SECRET_KEY }}
          FILES: ${{ steps.glb.outputs.files }}
          PROJECT_ID: ${{ secrets.UNITY_PROJECT_ID }}
        run: |
          set -euo pipefail

          AUTH_HEADER=$(printf "%s:%s" "$UNITY_KEY_ID" "$UNITY_SECRET_KEY" | base64 | tr -d '\n')
          CREATE_ASSET_URL="https://services.api.unity.com/assets/v1/projects/${PROJECT_ID}/assets"

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            if [ ! -f "$file" ]; then
              echo "File not found in checkout: $file"
              exit 1
            fi

            file_name=$(basename "$file" .glb)
            file_base=$(basename "$file")
            file_size=$(stat -c%s "$file")

            echo "Processing: $file"
            echo "Asset name: $file_name"
            echo "File size: $file_size"

            # Step 1: Create asset
            asset_payload=$(jq -n \
              --arg name "$file_name" \
              --arg description "Created from GitHub update for $file" \
              '{
                name: $name,
                description: $description,
                tags: ["github", "glb"],
                primaryType: "3D Model"
              }')

            asset_response=$(curl --fail -sS -X POST "$CREATE_ASSET_URL" \
              -H "Authorization: Basic $AUTH_HEADER" \
              -H "Content-Type: application/json" \
              -d "$asset_payload")

            echo "Asset response: $asset_response"
            echo "Datasets returned:"
            echo "$asset_response" | jq '.datasets'

            asset_id=$(echo "$asset_response" | jq -r '.assetId')
            asset_version=$(echo "$asset_response" | jq -r '.assetVersion')

            if [ -z "$asset_id" ] || [ "$asset_id" = "null" ]; then
              echo "Failed to get assetId from response"
              exit 1
            fi

            if [ -z "$asset_version" ] || [ "$asset_version" = "null" ]; then
              echo "Failed to get assetVersion from response"
              exit 1
            fi

            dataset_id=$(echo "$asset_response" | jq -r '
              (
                .datasets[]
                | select(
                    (.name | ascii_downcase | contains("source")) or
                    ((.systemTags // []) | map(ascii_downcase) | any(contains("source")))
                  )
                | .datasetId
              ) // .datasets[0].datasetId
            ')

            if [ -z "$dataset_id" ] || [ "$dataset_id" = "null" ]; then
              echo "Failed to get datasetId from response"
              exit 1
            fi

            echo "Created assetId: $asset_id"
            echo "Asset version: $asset_version"
            echo "Dataset ID: $dataset_id"

            # Step 2: Create file entry
            create_file_url="https://services.api.unity.com/assets/v1/projects/${PROJECT_ID}/assets/${asset_id}/versions/${asset_version}/datasets/${dataset_id}/files"

            file_payload=$(jq -n \
              --arg filePath "$file" \
              --arg description "Uploaded from GitHub for $file_name" \
              --arg fileSize "$file_size" \
              '{
                filePath: $filePath,
                description: $description,
                tags: ["github", "glb"],
                fileSize: ($fileSize | tonumber),
                mainFile: true,
                createEvenIfFrozen: true
              }')

            file_response=$(curl --fail -sS -X POST "$create_file_url" \
              -H "Authorization: Basic $AUTH_HEADER" \
              -H "Content-Type: application/json" \
              -d "$file_payload")

            echo "File response: $file_response"

            upload_url=$(echo "$file_response" | jq -r '.uploadUrl')

            if [ -z "$upload_url" ] || [ "$upload_url" = "null" ]; then
              echo "Failed to get uploadUrl from file response"
              exit 1
            fi

            # Step 3: Upload bytes to returned blob URL
            echo "Uploading file bytes for $file_base"
            curl --fail -sS -X PUT "$upload_url" \
              -H "x-ms-blob-type: BlockBlob" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file"

            echo "Upload complete for: $file"

          done <<< "$FILES"
